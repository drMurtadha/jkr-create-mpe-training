name: Terbit portal latihan

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repositori
        uses: actions/checkout@v4
      - name: Konfigurasi Pages
        uses: actions/configure-pages@v5
      - name: Muat naik portal
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Terbit ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
