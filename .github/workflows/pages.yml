name: Terbit portal latihan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repositori
        uses: actions/checkout@v4
      - name: Sediakan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Pasang kebergantungan
        run: npm ci
      - name: Bina portal
        run: npm run build
      - name: Konfigurasi Pages
        uses: actions/configure-pages@v5
      - name: Muat naik portal
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Terbit ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
